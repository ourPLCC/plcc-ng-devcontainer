name: Check plcc-ng Release

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:        # Allow manual trigger for testing

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for new plcc-ng release on PyPI
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          LATEST=$(curl -fsSL https://pypi.org/pypi/plcc-ng/json | jq -r '.info.version')
          echo "Latest plcc-ng release: $LATEST"

          CURRENT=$(jq -r '.features["./features/plcc-ng"].version' \
            images/plcc-ng/.devcontainer/devcontainer.json)
          echo "Currently pinned: $CURRENT"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already up to date. No action needed."
            exit 0
          fi

          BRANCH="chore/update-plcc-ng-${LATEST}"

          # Idempotency guard: keyed on the PR, not the branch. A branch with no
          # PR means an earlier run died between push and PR creation; that must
          # be recoverable, not mistaken for work already done.
          if [ -n "$(gh pr list --head "$BRANCH" --state all --json number --jq '.[].number')" ]; then
            echo "A PR for '$BRANCH' already exists. No action needed."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch '$BRANCH' exists with no PR. Recovering by opening the PR."
            # actions/checkout configures a single-branch refspec, so no
            # origin/$BRANCH tracking ref exists here — use FETCH_HEAD.
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"

            for cfg in images/plcc-ng/.devcontainer/devcontainer.json \
                       images/plcc-ng-full/.devcontainer/devcontainer.json; do
              jq --arg v "$LATEST" \
                '.features["./features/plcc-ng"].version = $v' \
                "$cfg" > tmp.json
              mv tmp.json "$cfg"
            done

            git add images
            git commit -m "fix: update plcc-ng to ${LATEST}"

            # Race-condition guard: treat push failure as no-op
            git push origin "$BRANCH" || {
              echo "Push failed — concurrent run. Exiting cleanly."
              exit 0
            }
          fi

          PR_URL=$(gh pr create \
            --title "fix: update plcc-ng to ${LATEST}" \
            --body "$(cat <<EOF
          Automated update: plcc-ng has a new release (${LATEST}).

          CI will build and test both images on this PR. Merge if green — merging triggers the release workflow, which publishes new versioned images automatically.

          PyPI release: https://pypi.org/project/plcc-ng/${LATEST}/
          EOF
          )" \
            --base main \
            --head "$BRANCH")

          echo "Opened $PR_URL"

          # Cosmetic only — never fail the run over a missing label or scope.
          gh pr edit "$PR_URL" --add-label automated \
            || echo "::warning::Could not apply the 'automated' label to $PR_URL"
